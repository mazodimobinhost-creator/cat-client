name: CF check + deliberate 1101 capture (take 4)

# Two questions, in this order:
#   1. Is the Cloudflare account behind the token alive again? (GET only)
#   2. If it is, what does a real 1101 look like in the client's raw answer and in
#      `wrangler tail`? — reproduced on purpose, on a name of its own
#      (catpanel-test-1101), never on edge-9ccq0 / edge-vgiab, and deleted at the end.
#
# The deliberate 1101 is a module whose top-level code throws: the upload is valid
# (the module parses), the script starts, and every request then dies before the
# handler runs — which is exactly the class of failure the app reported.
# If the account still answers 403/9109, the last two steps are skipped by design.

on:
  push:
    branches: ['arena/*']
    paths:
      - '.github/workflows/cf-readonly-diag.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cf-readonly-diag
  cancel-in-progress: true

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || vars.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' || vars.CLOUDFLARE_API_TOKEN != '' }}
      HAS_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' || vars.CLOUDFLARE_ACCOUNT_ID != '' }}
      TARGETS: 'edge-9ccq0 edge-vgiab'
      SUB: 'zojfup'
      APP_PROBE: 'catpanel-test'
      CRASH_PROBE: 'catpanel-test-1101'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Credentials present?
        run: |
          echo "HAS_TOKEN=$HAS_TOKEN HAS_ACCOUNT=$HAS_ACCOUNT"
          [ "$HAS_TOKEN" = "true" ] && [ "$HAS_ACCOUNT" = "true" ] || { echo "::error title=credentials::nothing to read with — stopping"; exit 1; }
          echo "::add-mask::$CLOUDFLARE_ACCOUNT_ID"
          mkdir -p /tmp/diag

      - name: Account state, right now (GET only)
        continue-on-error: true
        run: |
          esc() { sed -e 's/%/%25/g' | sed -e ':a' -e 'N' -e '$!ba' -e 's/\n/%0A/g'; }
          LOG=/tmp/step-1.log
          set +e
          (
            get() {
              code=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                "https://api.cloudflare.com/client/v4/$1" -o /tmp/diag/body.json -w '%{http_code}')
              echo "GET /$1 -> HTTP $code"
              head -c 400 /tmp/diag/body.json; echo
              echo "---"
              if [ "$1" = "accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts" ] && [ "$code" = "200" ]; then
                touch /tmp/diag/scripts_ok
                echo "workers visible on the account right now:"
                jq -r '.result[] | "  \(.id)"' /tmp/diag/body.json 2>/dev/null
              fi
              sleep 6
            }
            echo "HAS_TOKEN=$HAS_TOKEN HAS_ACCOUNT=$HAS_ACCOUNT"
            get "user/tokens/verify"
            get "user"
            get "user/memberships"
            get "accounts/$CLOUDFLARE_ACCOUNT_ID"
            get "accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts"
            if [ -f /tmp/diag/scripts_ok ]; then echo "ACCOUNT IS ANSWERING AGAIN"; else echo "account still refuses reads — steps 3 and 4 will be skipped"; fi
          ) > "$LOG" 2>&1
          code=$?
          echo "::notice title=diag-1-exit-$code::$(esc < "$LOG" | head -c 3400)"
          echo "--- step exit: $code ---"; cat "$LOG"; exit $code

      - name: The two routes, right now (GET only)
        continue-on-error: true
        run: |
          esc() { sed -e 's/%/%25/g' | sed -e ':a' -e 'N' -e '$!ba' -e 's/\n/%0A/g'; }
          LOG=/tmp/step-2.log
          set +e
          (
            for name in $TARGETS; do
              echo "------------------------------ $name"
              url="https://$name.$SUB.workers.dev"
              echo "DNS: $(getent hosts "$name.$SUB.workers.dev" | head -2 | tr '\n' ' ')"
              curl -sS -D /tmp/diag/h.$name.hdr -o /tmp/diag/h.$name.out -w "  /health -> HTTP %{http_code}, %{size_download} bytes, %{content_type}\n" --max-time 20 "$url/health"
              echo "  body: $(head -c 240 /tmp/diag/h.$name.out | tr -d '\n')"
              echo "  cf-ray: $(grep -i '^cf-ray' /tmp/diag/h.$name.hdr | tr -d '\r')"
              sleep 4
            done
            if [ -f /tmp/diag/scripts_ok ]; then
              echo "--- the API answers, so attach a tail to each route (observation only) ---"
              npm install --no-save --no-audit --no-fund wrangler@4.149.0 --silent || true
              for name in $TARGETS; do
                timeout 45 ./node_modules/.bin/wrangler tail "$name" --format json > "/tmp/diag/tail-$name.log" 2>&1 &
                TPID=$!
                sleep 14
                curl -sS -o /dev/null -w "  (during tail) $name /health -> HTTP %{http_code}\n" --max-time 20 "https://$name.$SUB.workers.dev/health" || true
                sleep 5
                kill "$TPID" 2>/dev/null || true
                echo "  tail $name:"
                grep -a . "/tmp/diag/tail-$name.log" | head -16 | cut -c1-320 | sed 's/^/    /'
              done
            else
              echo "--- the API still refuses reads, so no tail was attempted (step 1 says why) ---"
            fi
          ) > "$LOG" 2>&1
          code=$?
          echo "::notice title=diag-2-exit-$code::$(esc < "$LOG" | head -c 3400)"
          echo "--- step exit: $code ---"; cat "$LOG"; exit $code

      - name: If the account answers — does the app's own upload path still work?
        if: ${{ always() }}
        continue-on-error: true
        run: |
          esc() { sed -e 's/%/%25/g' | sed -e ':a' -e 'N' -e '$!ba' -e 's/\n/%0A/g'; }
          LOG=/tmp/step-3.log
          set +e
          (
            [ -f /tmp/diag/scripts_ok ] || { echo "skipped: the account still refuses reads (see step 1)"; exit 0; }
            echo "uploading the real panel the way the app does (same file, same metadata):"
            curl -sS -X PUT "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$APP_PROBE" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -F "metadata={\"main_module\":\"worker.js\",\"compatibility_date\":\"2025-03-04\",\"compatibility_flags\":[\"nodejs_compat\"]};type=application/json" \
              -F "worker.js=@dist-panel/catpanel.obf.js;type=application/javascript+module" \
              -o /tmp/diag/up3.json -w "  PUT /workers/scripts/$APP_PROBE -> HTTP %{http_code}\n"
            head -c 320 /tmp/diag/up3.json; echo
            sleep 20
            url="https://$APP_PROBE.$SUB.workers.dev"
            curl -sS -o /tmp/diag/a3.out -w "  /health -> HTTP %{http_code}, %{content_type}\n" --max-time 25 "$url/health"
            echo "  body: $(head -c 220 /tmp/diag/a3.out | tr -d '\n')"
            curl -sS -o /tmp/diag/a3v.out -w "  /api/version -> HTTP %{http_code}\n" --max-time 25 "$url/api/version"
            echo "  body: $(head -c 220 /tmp/diag/a3v.out | tr -d '\n')"
            echo "cleanup:"
            curl -sS -X DELETE "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$APP_PROBE" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -o /tmp/diag/del3.json -w "  DELETE /workers/scripts/$APP_PROBE -> HTTP %{http_code}\n"
            head -c 200 /tmp/diag/del3.json; echo
          ) > "$LOG" 2>&1
          code=$?
          echo "::notice title=diag-3-exit-$code::$(esc < "$LOG" | head -c 3400)"
          echo "--- step exit: $code ---"; cat "$LOG"; exit $code

      - name: Reproduce a real 1101 on purpose and capture what it looks like
        if: ${{ always() }}
        continue-on-error: true
        run: |
          esc() { sed -e 's/%/%25/g' | sed -e ':a' -e 'N' -e '$!ba' -e 's/\n/%0A/g'; }
          LOG=/tmp/step-4.log
          set +e
          (
            [ -f /tmp/diag/scripts_ok ] || { echo "skipped: the account still refuses reads (see step 1) — no way to create the probe worker"; exit 0; }
            printf '%s\n' \
              '// CAT-1101-PROBE: this module is valid, it just throws while starting.' \
              'throw new Error("CAT-1101-PROBE: deliberate top-level throw at script startup");' \
              'export default { fetch() { return new Response("this line is never reached"); } };' \
              > /tmp/diag/crash.js
            echo "the probe module (module parses; fails at startup):"
            sed 's/^/    /' /tmp/diag/crash.js
            node --check /tmp/diag/crash.js && echo "  node --check: parses ok (so the upload will be accepted)"
            curl -sS -X PUT "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$CRASH_PROBE" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -F "metadata={\"main_module\":\"worker.js\",\"compatibility_date\":\"2025-03-04\",\"compatibility_flags\":[\"nodejs_compat\"]};type=application/json" \
              -F "worker.js=@/tmp/diag/crash.js;type=application/javascript+module" \
              -o /tmp/diag/up4.json -w "  PUT /workers/scripts/$CRASH_PROBE -> HTTP %{http_code}\n"
            head -c 320 /tmp/diag/up4.json; echo
            npm install --no-save --no-audit --no-fund wrangler@4.149.0 --silent || true
            sleep 15
            timeout 60 ./node_modules/.bin/wrangler tail "$CRASH_PROBE" --format json > /tmp/diag/tail-1101.log 2>&1 &
            TPID=$!
            sleep 14
            url="https://$CRASH_PROBE.$SUB.workers.dev"
            echo "what a client sees (this is the shape of the app's 1101):"
            curl -sS -D /tmp/diag/h4.hdr -o /tmp/diag/h4.out -w "  GET /health -> HTTP %{http_code}, %{size_download} bytes, %{content_type}\n" --max-time 25 "$url/health"
            echo "  headers: $(grep -iE '^(HTTP/|cf-ray|content-type|server)' /tmp/diag/h4.hdr | tr -d '\r' | tr '\n' ' | ')"
            echo "  body   : $(head -c 300 /tmp/diag/h4.out | tr -d '\n')"
            curl -sS -o /dev/null -w "  GET / -> HTTP %{http_code}, %{content_type}\n" --max-time 25 "$url/" || true
            sleep 10
            kill "$TPID" 2>/dev/null || true
            echo "what the tail says (raw, this is the part that names the cause):"
            grep -a . /tmp/diag/tail-1101.log | head -24 | cut -c1-460 | sed 's/^/    /'
            echo "cleanup:"
            curl -sS -X DELETE "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$CRASH_PROBE" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -o /tmp/diag/del4.json -w "  DELETE /workers/scripts/$CRASH_PROBE -> HTTP %{http_code}\n"
            head -c 200 /tmp/diag/del4.json; echo
            sleep 6
            curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts" -o /tmp/diag/left.json -w "  GET /workers/scripts -> HTTP %{http_code}\n"
            echo "  workers left on the account: $(jq -r '[.result[].id] | join(", ")' /tmp/diag/left.json 2>/dev/null)"
          ) > "$LOG" 2>&1
          code=$?
          echo "::notice title=diag-4-exit-$code::$(esc < "$LOG" | head -c 3400)"
          echo "--- step exit: $code ---"; cat "$LOG"; exit $code
