name: CF read-only diagnosis (why do the two edge-* workers answer 1101) — take 2

# READ-ONLY: GET requests plus one temporary tail session. Nothing is deployed,
# deleted or modified. This take answers two questions with evidence:
#   1. what the token in Actions is actually allowed to read — raw HTTP codes and
#      raw API bodies, including the 403 body that take 1 swallowed;
#   2. how the two live routes answer right now — /health, /api/version and the
#      `wrangler tail` output, which is where a startup exception would appear.
# Take 1 failed for reasons that were mine: an indentation error inside an inline
# python made the step die before it printed the API bodies, and the subdomain
# lookup came back empty so the probe URL was malformed (`edge-9ccq0..workers.dev`).
# There is no inline python here any more — jq and head do the reading.

on:
  push:
    branches: ['arena/*']
    paths:
      - '.github/workflows/cf-readonly-diag.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cf-readonly-diag
  cancel-in-progress: true

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || vars.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' || vars.CLOUDFLARE_API_TOKEN != '' }}
      HAS_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' || vars.CLOUDFLARE_ACCOUNT_ID != '' }}
      WRANGLER_SEND_METRICS: 'false'
      TARGETS: 'edge-9ccq0 edge-vgiab'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Credentials present?
        run: |
          echo "HAS_TOKEN=$HAS_TOKEN HAS_ACCOUNT=$HAS_ACCOUNT"
          [ "$HAS_TOKEN" = "true" ] && [ "$HAS_ACCOUNT" = "true" ] || { echo "::error title=credentials::nothing to read with — stopping"; exit 1; }
          echo "::add-mask::$CLOUDFLARE_ACCOUNT_ID"
          mkdir -p /tmp/diag

      - name: Token, account, subdomain — exactly as the API sees them
        continue-on-error: true
        run: |
          esc() { sed -e 's/%/%25/g' | sed -e ':a' -e 'N' -e '$!ba' -e 's/\n/%0A/g'; }
          LOG=/tmp/step-1.log
          set +e
          (
            curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/user/tokens/verify" -o /tmp/verify.json -w "GET /user/tokens/verify -> HTTP %{http_code}\n"
            head -c 300 /tmp/verify.json; echo
            curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID" -o /tmp/acct.json -w "GET /accounts/<id> -> HTTP %{http_code}\n"
            head -c 300 /tmp/acct.json; echo
            curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" -o /tmp/sub.json -w "GET /workers/subdomain -> HTTP %{http_code}\n"
            head -c 300 /tmp/sub.json; echo
            SUB_JSON="$(jq -r '.result.subdomain // empty' /tmp/sub.json 2>/dev/null)"
            echo "subdomain from the API: ${SUB_JSON:-none}"
            echo "SUB=$SUB_JSON" >> "$GITHUB_ENV"
          ) > "$LOG" 2>&1
          code=$?
          echo "::notice title=diag-1-exit-$code::$(esc < "$LOG" | head -c 3400)"
          echo "--- step exit: $code ---"; cat "$LOG"; exit $code

      - name: Can this token read the account's scripts? (the 403 question)
        continue-on-error: true
        run: |
          esc() { sed -e 's/%/%25/g' | sed -e ':a' -e 'N' -e '$!ba' -e 's/\n/%0A/g'; }
          LOG=/tmp/step-2.log
          set +e
          (
            for path in "workers/scripts" "workers/scripts/edge-9ccq0" "workers/scripts/edge-9ccq0/settings" "workers/scripts/edge-9ccq0/subdomain" "workers/scripts/edge-9ccq0/deployments" "workers/scripts/edge-vgiab"; do
              out="/tmp/diag/$(echo "$path" | tr '/' '_').json"
              code=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/$path" -o "$out" -w "%{http_code}")
              echo "GET /$path -> HTTP $code ($(stat -c%s "$out") bytes)"
              head -c 300 "$out"; echo
              case "$path" in
                workers/scripts/edge-9ccq0|workers/scripts/edge-vgiab)
                  [ "$code" = "200" ] && cp "$out" "/tmp/diag/got-$(echo "$path" | tr '/' '_')" ;;
              esac
            done
            echo "--- what the runner sees for the artifacts the app uploads today ---"
            for f in dist-panel/catpanel.obf.js app/src/main/assets/panels/catpanel.min.js app/src/main/assets/panels/catclient.worker.js; do
              [ -f "$f" ] || continue
              printf '%-52s %10s bytes  ' "$f" "$(stat -c%s "$f")"
              if node --check "$f" 2>/dev/null; then echo "parses ok"; else echo "DOES NOT PARSE"; fi
            done
            grep -m1 -o "CAT_PANEL_VERSION = '[0-9.]*'" dist-panel/catpanel.obf.js app/src/main/assets/panels/catpanel.min.js 2>/dev/null || true
          ) > "$LOG" 2>&1
          code=$?
          echo "::notice title=diag-2-exit-$code::$(esc < "$LOG" | head -c 3400)"
          echo "--- step exit: $code ---"; cat "$LOG"; exit $code

      - name: If the script bytes came back, does the module parse?
        continue-on-error: true
        run: |
          esc() { sed -e 's/%/%25/g' | sed -e ':a' -e 'N' -e '$!ba' -e 's/\n/%0A/g'; }
          LOG=/tmp/step-3.log
          set +e
          (
            found=0
            for f in /tmp/diag/got-workers_scripts_edge-9ccq0 /tmp/diag/got-workers_scripts_edge-vgiab; do
              [ -f "$f" ] || continue
              found=1
              name="$(basename "$f" | grep -o 'edge-[a-z0-9]*')"
              cp "$f" "/tmp/diag/$name.mjs"
              echo "$name: $(stat -c%s "/tmp/diag/$name.mjs") bytes, sha256 $(sha256sum "/tmp/diag/$name.mjs" | cut -d' ' -f1)"
              echo "  head: $(head -c 110 "/tmp/diag/$name.mjs" | tr -d '\n')"
              echo "  tail: $(tail -c 110 "/tmp/diag/$name.mjs" | tr -d '\n')"
              if node --check "/tmp/diag/$name.mjs" 2>"/tmp/diag/$name.err"; then
                echo "  parser: PARSES — a syntax error is not the cause"
              else
                echo "  parser: DOES NOT PARSE — this alone is an 1101 with no report:"
                head -6 "/tmp/diag/$name.err" | sed 's/^/    /'
              fi
            done
            [ "$found" = "1" ] || echo "(the token could not read the script bytes — the HTTP codes above say why)"
          ) > "$LOG" 2>&1
          code=$?
          echo "::notice title=diag-3-exit-$code::$(esc < "$LOG" | head -c 3400)"
          echo "--- step exit: $code ---"; cat "$LOG"; exit $code

      - name: Live probe of the two routes, with tail attached (observation only)
        continue-on-error: true
        run: |
          esc() { sed -e 's/%/%25/g' | sed -e ':a' -e 'N' -e '$!ba' -e 's/\n/%0A/g'; }
          LOG=/tmp/step-4.log
          set +e
          (
            SUB="${SUB:-zojfup}"
            echo "using subdomain: $SUB"
            npm install --no-save --no-audit --no-fund wrangler@4.149.0 --silent
            for name in $TARGETS; do
              echo "------------------------------ $name"
              url="https://$name.$SUB.workers.dev"
              echo "  DNS: $(getent hosts "$name.$SUB.workers.dev" | head -2 | tr '\n' ' ' || true)"
              ./node_modules/.bin/wrangler tail "$name" --format json > "/tmp/diag/tail-$name.log" 2>&1 &
              TPID=$!
              sleep 12
              curl -sS -o "/tmp/diag/body-$name.html" \
                -w "  /health -> HTTP %{http_code}, %{size_download} bytes, type=%{content_type}\n" \
                --max-time 25 "$url/health" || echo "  (curl failed)"
              curl -sS -o /dev/null -w "  /api/version -> HTTP %{http_code}, type=%{content_type}\n" --max-time 25 "$url/api/version" || true
              sleep 8
              kill "$TPID" 2>/dev/null || true
              echo "  body head: $(head -c 300 "/tmp/diag/body-$name.html" 2>/dev/null | tr -d '\n')"
              echo "  tail log:"
              grep -a . "/tmp/diag/tail-$name.log" 2>/dev/null | head -14 | cut -c1-320 | sed 's/^/    /' || echo "    (none)"
            done
          ) > "$LOG" 2>&1
          code=$?
          echo "::notice title=diag-4-exit-$code::$(esc < "$LOG" | head -c 3400)"
          echo "--- step exit: $code ---"; cat "$LOG"; exit $code
