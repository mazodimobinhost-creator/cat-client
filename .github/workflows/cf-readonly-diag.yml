name: CF read-only diagnosis (why do the two edge-* workers answer 1101)

# READ-ONLY. It never deploys, never deletes, never writes anything to the account.
# It reads what the API already knows about the two workers the app created
# (`edge-9ccq0`, `edge-vgiab`) and observes how the live route answers:
#
#   * the script the account currently holds for each name -> size, sha256, and
#     whether that module actually parses (node --check on the downloaded file);
#   * that script's settings -> bindings, compatibility date and flags, main_module;
#   * the workers.dev route state;
#   * a live GET of /health and /api/version with `wrangler tail` attached, so the
#     edge's own error text and any startup exception come back verbatim.
#
# The only things it does are GET requests plus one temporary tail session.
# It is deleted from the tree again once it has answered the question.

on:
  push:
    branches: ['arena/*']
    paths:
      - '.github/workflows/cf-readonly-diag.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cf-readonly-diag
  cancel-in-progress: true

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || vars.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' || vars.CLOUDFLARE_API_TOKEN != '' }}
      HAS_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' || vars.CLOUDFLARE_ACCOUNT_ID != '' }}
      WRANGLER_SEND_METRICS: 'false'
      TARGETS: 'edge-9ccq0 edge-vgiab'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Credentials present?
        run: |
          echo "HAS_TOKEN=$HAS_TOKEN HAS_ACCOUNT=$HAS_ACCOUNT"
          if [ "$HAS_TOKEN" != "true" ] || [ "$HAS_ACCOUNT" != "true" ]; then
            echo "::error::no Cloudflare credentials in Actions → Secrets — stopping here; nothing was read"
            exit 1
          fi
      - name: Account inventory (GET only)
        run: |
          set -o pipefail
          curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts" \
            -o /tmp/scripts.json -w "GET /workers/scripts → HTTP %{http_code}\n"
          python3 -c '
          import json
          d = json.load(open("/tmp/scripts.json"))
          print("success:", d.get("success"), "| errors:", d.get("errors"))
          for w in d.get("result", []):
              print("  name=%-22s size=%-10s created=%s modified=%s etag=%s" % (
                  w.get("id"), w.get("size"), w.get("created_on"), w.get("modified_on"), (w.get("etag") or "")[:12]))
          '
      - name: Read each script and check whether the module parses (GET only)
        run: |
          set -o pipefail
          mkdir -p /tmp/diag
          for name in $TARGETS; do
            echo "────────────────────────────── $name"
            curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -o "/tmp/diag/$name.mjs" \
              -w "  download: HTTP %{http_code}, %{size_download} bytes, type=%{content_type}\n" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$name"
            echo "  sha256 : $(sha256sum "/tmp/diag/$name.mjs" | cut -d' ' -f1)"
            echo "  head   : $(head -c 120 "/tmp/diag/$name.mjs" | tr -d '\n')"
            echo "  tail   : $(tail -c 120 "/tmp/diag/$name.mjs" | tr -d '\n')"
            if node --check "/tmp/diag/$name.mjs" 2>"/tmp/diag/$name.err"; then
              echo "  parser : the module PARSES — a syntax error is not the cause"
            else
              echo "  parser : DOES NOT PARSE — this alone produces «Error 1101» with no report:"
              sed 's/^/           /' "/tmp/diag/$name.err" | head -8
            fi
            echo "  settings:"
            curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$name/settings" \
              -o "/tmp/diag/$name.settings.json" -w "    GET settings → HTTP %{http_code}\n"
            python3 -c '
          import json, sys
          name = sys.argv[1]
          d = json.load(open("/tmp/diag/%s.settings.json" % name))
          r = d.get("result") or {}
          print("    success:", d.get("success"), "| errors:", d.get("errors"))
          for k in ("main_module", "compatibility_date", "compatibility_flags", "usage_model", "placement_mode"):
              if k in r:
                  print("    %s: %s" % (k, r.get(k)))
          for b in (r.get("bindings") or []):
              val = b.get("namespace_id") or b.get("class_name") or ""
              print("    binding: %s/%s%s" % (b.get("type"), b.get("name"), "" if not val else " -> " + str(val)[:40]))
          ' "$name"
            echo "  route  :"
            curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$name/subdomain" \
              -o "/tmp/diag/$name.subdomain.json" -w "    GET subdomain → HTTP %{http_code}\n"
            python3 -c '
          import json, sys
          d = json.load(open("/tmp/diag/%s.subdomain.json" % sys.argv[1]))
          print("    success:", d.get("success"), "| result:", d.get("result"), "| errors:", d.get("errors"))
          ' "$name"
          done
      - name: What the app uploads today, for comparison (local files only)
        run: |
          for f in dist-panel/catpanel.obf.js app/src/main/assets/panels/catpanel.min.js app/src/main/assets/panels/catclient.worker.js; do
            [ -f "$f" ] || continue
            printf '%-52s %10s bytes  ' "$f" "$(stat -c%s "$f")"
            if node --check "$f" 2>/dev/null; then echo "parses ok"; else echo "DOES NOT PARSE"; fi
          done
          grep -m1 -o "CAT_PANEL_VERSION = '[0-9.]*'" dist-panel/catpanel.obf.js app/src/main/assets/panels/catpanel.min.js 2>/dev/null || true
      - name: Live probe with wrangler tail attached (observation only)
        run: |
          set -o pipefail
          npm install --no-save --no-audit --no-fund wrangler@4.149.0 --silent
          SUB="$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
            | python3 -c 'import json,sys; print((json.load(sys.stdin).get("result") or {}).get("subdomain",""))')"
          echo "account subdomain: ${SUB:-unknown}"
          for name in $TARGETS; do
            echo "────────────────────────────── $name"
            ./node_modules/.bin/wrangler tail "$name" --format json > "/tmp/diag/tail-$name.log" 2>&1 &
            TPID=$!
            sleep 10
            url="https://$name.${SUB}.workers.dev"
            echo "  probe $url/health"
            curl -sS -o "/tmp/diag/body-$name.html" \
              -w "    → HTTP %{http_code}, %{size_download} bytes, type=%{content_type}\n" \
              --max-time 25 "$url/health" || echo "    (curl failed)"
            curl -sS -o /dev/null -w "    /api/version → HTTP %{http_code}, type=%{content_type}\n" --max-time 25 "$url/api/version" || true
            sleep 8
            kill "$TPID" 2>/dev/null || true
            echo "  edge page title: $(grep -o -m1 '<title>[^<]*</title>' "/tmp/diag/body-$name.html" || true)"
            echo "  edge page head : $(head -c 240 "/tmp/diag/body-$name.html" | tr -d '\n')"
            echo "  tail log (first 12 non-empty lines, 400 chars each):"
            grep -a . "/tmp/diag/tail-$name.log" | head -12 | cut -c1-400 | sed 's/^/    /' || echo "    (no tail output)"
            echo "  exception-shaped text in the tail:"
            grep -a -o -E '"exceptions":\[[^]]*\]|"message":"[^"]{0,300}"|"name":"[^"]{0,60}"' "/tmp/diag/tail-$name.log" | head -6 | sed 's/^/    /' || echo "    (none)"
          done
