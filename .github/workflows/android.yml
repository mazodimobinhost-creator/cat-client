name: Cat Client Android Build

on:
  push:
    branches: [arena/01a0bf96-cat-client, main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.8'
          cache: false

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android toolchain
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'ndk;29.0.14206865' 'cmake;3.22.1'
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - name: Cache FlClash core
        uses: actions/cache@v5
        with:
          path: |
            app/src/main/jniLibs
            app/src/main/cpp/includes
          key: ${{ runner.os }}-${{ runner.arch }}-flclash-${{ hashFiles('scripts/build-flclash-core.sh', 'scripts/patches/*.patch', '.github/workflows/android.yml') }}

      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v -keystore $RUNNER_TEMP/catclient.jks -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass catclient -alias catclient -keypass catclient -dname "CN=Cat Client"

      - name: Build Mihomo core
        env:
          ANDROID_NDK: ${{ env.ANDROID_HOME }}/ndk/29.0.14206865
        run: chmod +x gradlew scripts/build-flclash-core.sh && ./scripts/build-flclash-core.sh

      - name: Build debug APK
        env:
          ANDROID_NDK: ${{ env.ANDROID_HOME }}/ndk/29.0.14206865
        run: |
          chmod +x gradlew
          set +e
          ./gradlew assembleDebug --stacktrace --console=plain 2>&1 | tee build-log.txt
          exit ${PIPESTATUS[0]}

      - name: Build release APK
        if: success()
        env:
          ANDROID_NDK: ${{ env.ANDROID_HOME }}/ndk/29.0.14206865
          CATCLIENT_RELEASE_STORE_FILE: ${{ runner.temp }}/catclient.jks
          CATCLIENT_RELEASE_STORE_PASSWORD: catclient
          CATCLIENT_RELEASE_KEY_ALIAS: catclient
          CATCLIENT_RELEASE_KEY_PASSWORD: catclient
        run: chmod +x gradlew && ./gradlew assembleRelease

      - name: Upload debug APKs
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: catclient-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload release APKs
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: catclient-release-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload build log (diagnostic)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-log-${{ github.sha }}
          path: build-log.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Create GitHub Release and attach APKs
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/arena/01a0bf96-cat-client'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(date +%Y%m%d%H%M)"
          git tag "$TAG"
          git push origin "$TAG" || true
          gh release create "$TAG" app/build/outputs/apk/release/*.apk app/build/outputs/apk/debug/*.apk \
            --title "Cat Client $TAG" \
            --notes "Automated Cat Client build. Download catclient-release APK and install on your Android device." \
            || gh release upload "$TAG" app/build/outputs/apk/release/*.apk app/build/outputs/apk/debug/*.apk --clobber
