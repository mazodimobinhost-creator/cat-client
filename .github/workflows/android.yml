name: Cat Client Android Build

on:
  push:
    branches: [arena/01a0bf96-cat-client, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: actions/setup-go@v6
        with:
          go-version: '1.24.0'
          cache: false

      - name: Install Android SDK command line tools
        run: |
          set -e
          export ANDROID_HOME=$HOME/android-sdk
          mkdir -p $ANDROID_HOME/cmdline-tools
          CDL_URL="https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          curl -fSL "$CDL_URL" -o /tmp/cmdtools.zip
          unzip -q /tmp/cmdtools.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | sdkmanager --licenses >/dev/null
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;35.0.0' 'ndk;29.0.14206865' 'cmake;3.22.1'
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - name: Cache FlClash core
        uses: actions/cache@v5
        with:
          path: |
            app/src/main/jniLibs
            app/src/main/cpp/includes
          key: ${{ runner.os }}-flclash-${{ hashFiles('scripts/build-flclash-core.sh', 'scripts/patches/*.patch', '.github/workflows/android.yml') }}

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-

      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v -keystore $RUNNER_TEMP/catclient.jks -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass catclient -alias catclient -keypass catclient -dname "CN=Cat Client"

      - name: Build Mihomo core
        env:
          ANDROID_NDK: ${{ env.ANDROID_HOME }}/ndk/29.0.14206865
          GOTOOLCHAIN: auto
        run: |
          chmod +x gradlew scripts/build-flclash-core.sh
          ./scripts/build-flclash-core.sh

      - name: Build debug APK
        env:
          ANDROID_NDK: ${{ env.ANDROID_HOME }}/ndk/29.0.14206865
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Build release APK
        env:
          ANDROID_NDK: ${{ env.ANDROID_HOME }}/ndk/29.0.14206865
          CATCLIENT_RELEASE_STORE_FILE: ${{ runner.temp }}/catclient.jks
          CATCLIENT_RELEASE_STORE_PASSWORD: catclient
          CATCLIENT_RELEASE_KEY_ALIAS: catclient
          CATCLIENT_RELEASE_KEY_PASSWORD: catclient
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: CatClient-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: CatClient-release-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Create release
        if: github.event_name == 'push' && github.ref == 'refs/heads/arena/01a0bf96-cat-client'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(date +%Y%m%d%H%M)"
          git tag "$TAG"
          git push origin "$TAG" || true
          gh release create "$TAG" app/build/outputs/apk/release/*.apk app/build/outputs/apk/debug/*.apk \
            --title "Cat Client $TAG" \
            --notes "Cat Client automated build. Download CatClient-release APK and install it." \
            || gh release upload "$TAG" app/build/outputs/apk/release/*.apk app/build/outputs/apk/debug/*.apk --clobber
