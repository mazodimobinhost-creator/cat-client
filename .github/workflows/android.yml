name: Cat Client Android Build

on:
  push:
    branches: [arena/01a0bf96-cat-client, main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.4'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android toolchain
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "ndk;29.0.14206865" "cmake;3.22.1"
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Cache FlClash core
        uses: actions/cache@v4
        with:
          path: |
            app/src/main/jniLibs
            app/src/main/cpp/includes
          key: ${{ runner.os }}-flclash-${{ hashFiles('scripts/build-flclash-core.sh', 'scripts/patches/*.patch') }}

      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v -keystore $RUNNER_TEMP/catclient.jks -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass catclient -alias catclient -keypass catclient -dname "CN=Cat Client, O=CatClient, C=IR"

      - name: Build Mihomo core
        env:
          ANDROID_NDK: ${{ env.ANDROID_HOME }}/ndk/29.0.14206865
        run: |
          chmod +x gradlew scripts/build-flclash-core.sh
          ./scripts/build-flclash-core.sh

      - name: Build debug APK
        env:
          ANDROID_NDK: ${{ env.ANDROID_HOME }}/ndk/29.0.14206865
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Build release APK
        env:
          ANDROID_NDK: ${{ env.ANDROID_HOME }}/ndk/29.0.14206865
          CATCLIENT_RELEASE_STORE_FILE: ${{ runner.temp }}/catclient.jks
          CATCLIENT_RELEASE_STORE_PASSWORD: catclient
          CATCLIENT_RELEASE_KEY_ALIAS: catclient
          CATCLIENT_RELEASE_KEY_PASSWORD: catclient
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CatClient-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: CatClient-release-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/arena/01a0bf96-cat-client'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(date +%Y%m%d%H%M)-build"
          git tag "$TAG"
          git push origin "$TAG" || true
          gh release create "$TAG" app/build/outputs/apk/release/*.apk app/build/outputs/apk/debug/*.apk \
            --title "Cat Client $TAG" \
            --notes "Automated Cat Client build. Download CatClient-release APK below." \
            || gh release upload "$TAG" app/build/outputs/apk/release/*.apk app/build/outputs/apk/debug/*.apk --clobber
