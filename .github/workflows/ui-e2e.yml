name: UI end-to-end — boot panel, log in, verify, exercise the code (automatic)

# What this is: one automatic run that boots the panel on the real Workers engine
# (workerd), drives it with a real Chromium — fresh visitor, login through the form,
# verify the session, call the code paths, then check that a fresh browser context is
# still locked out — and reports the raw transcript as an artifact + annotation.
#
# What this is NOT: it does not touch the Cloudflare account. A 1101 out in the real
# edge needs an active account; that path lives in the deploy/panel workflows. This one
# answers «does the product actually work end to end in a browser» without an account.
on:
  workflow_dispatch:
  push:
    branches: ['arena/*']
    paths:
      - '.github/workflows/ui-e2e.yml'
      - 'scripts/panels/ui-e2e.mjs'
      - 'scripts/panels/workerd-local.capnp'

permissions:
  contents: read

concurrency:
  group: ui-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install Chromium (real browser) and the Workers engine
        continue-on-error: true
        run: |
          esc() { sed -e 's/%/%25/g' | sed -e ':a' -e 'N' -e '$!ba' -e 's/\n/%0A/g'; }
          LOG=/tmp/step-1.log
          set +e
          (
            npm install --no-save --no-audit --no-fund playwright@latest workerd@latest
            npx playwright install --with-deps chromium
            node -e "console.log('playwright', require('playwright/package.json').version)"
            ./node_modules/.bin/workerd --version
          ) > "$LOG" 2>&1
          code=$?
          echo "::notice title=ui-1-exit-$code::$(esc < "$LOG" | head -c 3400)"
          echo "--- step exit: $code ---"; tail -25 "$LOG"; exit $code

      - name: Boot the panel on workerd and run the browser test
        continue-on-error: true
        run: |
          esc() { sed -e 's/%/%25/g' | sed -e ':a' -e 'N' -e '$!ba' -e 's/\n/%0A/g'; }
          LOG=/tmp/step-2.log
          RESULT=0
          set +e
          (
            ./node_modules/.bin/workerd serve scripts/panels/workerd-local.capnp > /tmp/workerd.log 2>&1 &
            WPID=$!
            echo "workerd pid: $WPID"
            for i in $(seq 1 40); do
              if curl -sf -m 2 http://127.0.0.1:8799/health > /tmp/health.json 2>/dev/null; then
                echo "panel answered after ${i} tries: $(cat /tmp/health.json)"
                break
              fi
              sleep 1
            done
            curl -sS -m 5 -o /dev/null -w "GET /health -> HTTP %{http_code}\n" http://127.0.0.1:8799/health
            node scripts/panels/ui-e2e.mjs
            RC=$?
            echo "ui-e2e exit code: $RC"
            kill "$WPID" 2>/dev/null || true
            echo "--- workerd log tail ---"
            tail -12 /tmp/workerd.log | cut -c1-300
            echo "--- transcript ---"
            cat ui-e2e-transcript.txt 2>/dev/null
            exit $RC
          ) > "$LOG" 2>&1
          RESULT=$?
          echo "::notice title=ui-2-exit-$RESULT::$(esc < "$LOG" | head -c 3400)"
          echo "--- step exit: $RESULT ---"; tail -60 "$LOG"; exit $RESULT

      - name: Upload the transcript and the screenshot
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ui-e2e-${{ github.sha }}
          path: |
            ui-e2e-transcript.txt
            ui-e2e-dashboard.png
          if-no-files-found: warn
