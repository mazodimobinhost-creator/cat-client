name: CF live test (catpanel-test)

# ONE-OFF live test on a real Cloudflare account, on a throwaway Worker named
# `catpanel-test` and its own KV namespace. Both are deleted again in the last
# step of this run (and they are the only things this workflow ever writes).
#
#   stage A  — wrangler deploy of dist-panel/catpanel.min.js (--no-bundle)
#   stage A2 — the same file through wrangler's bundler (no --no-bundle)
#   stage B  — wrangler deploy of dist-panel/catpanel.obf.js (--no-bundle), the
#              artifact the Android app uploads over the API
#   stage C  — the app's OWN upload path: multipart PUT with main_module=worker.js,
#              compatibility_date 2025-03-04 + nodejs_compat and the
#              UUID/PANEL_PASSWORD/CAT_KV bindings, byte-for-byte like
#              CloudflareWorker.cfUploadWorker
#
# Every stage is followed by live checks (health/version/diag/selfcheck?throw=1/
# backup/subscription) with `wrangler tail` attached, so a 1101 comes back with
# its real error text. This file and cf-live-tools.mjs are deleted from the tree
# once the test is done.

on:
  push:
    branches: ['arena/*']
    paths:
      - '.github/workflows/cf-live-test.yml'
      - '.github/workflows/cf-live-tools.mjs'
  workflow_dispatch:

permissions:
  contents: write   # only to commit cf-live-results.md back onto the branch

concurrency:
  group: cf-live-test
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Secrets first, repository VARIABLES as a fallback: the two are separate
      # storages in the same GitHub screen (Settings → Secrets and variables →
      # Actions → «Secrets» / «Variables») and only one of them is seeded here.
      # HAS_* is printed by the preflight so the log says which storage answered.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || vars.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      HAS_SECRET_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
      HAS_SECRET_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
      HAS_VAR_TOKEN: ${{ vars.CLOUDFLARE_API_TOKEN != '' }}
      HAS_VAR_ACCOUNT: ${{ vars.CLOUDFLARE_ACCOUNT_ID != '' }}
      # Which candidate NAMES actually exist (values are never printed). A single
      # typo — or a trailing space — in a secret name is invisible in the list but
      # makes `secrets.X` empty, which is exactly the failure being chased here.
      # GITHUB_TOKEN / ACTIONS_RUNTIME_TOKEN are the control: GitHub injects them
      # into every run, so if those read as empty too, the `secrets` context itself
      # is not readable here and the problem is not the names.
      CANDIDATE_SECRETS_TOKEN: >-
        {"CLOUDFLARE_API_TOKEN": ${{ secrets['CLOUDFLARE_API_TOKEN'] != '' }}, "CLOUDFLARE_API_TOKEN ": ${{ secrets['CLOUDFLARE_API_TOKEN '] != '' }}, " CLOUDFLARE_API_TOKEN": ${{ secrets[' CLOUDFLARE_API_TOKEN'] != '' }}, "cloudflare_api_token": ${{ secrets['cloudflare_api_token'] != '' }}, "Cloudflare_Api_Token": ${{ secrets['Cloudflare_Api_Token'] != '' }}, "CLOUDFLARE_API_TOKEN_KEY": ${{ secrets['CLOUDFLARE_API_TOKEN_KEY'] != '' }}, "CLOUDFLARE_TOKEN": ${{ secrets['CLOUDFLARE_TOKEN'] != '' }}, "CF_API_TOKEN": ${{ secrets['CF_API_TOKEN'] != '' }}, "CF_TOKEN": ${{ secrets['CF_TOKEN'] != '' }}, "API_TOKEN": ${{ secrets['API_TOKEN'] != '' }}, "WORKERS_TOKEN": ${{ secrets['WORKERS_TOKEN'] != '' }}, "CLOUDFLARE_WORKERS_TOKEN": ${{ secrets['CLOUDFLARE_WORKERS_TOKEN'] != '' }}, "GITHUB_TOKEN": ${{ secrets['GITHUB_TOKEN'] != '' }}, "ACTIONS_RUNTIME_TOKEN": ${{ secrets['ACTIONS_RUNTIME_TOKEN'] != '' }}, "ACTIONS_ID_TOKEN_REQUEST_TOKEN": ${{ secrets['ACTIONS_ID_TOKEN_REQUEST_TOKEN'] != '' }}}
      CANDIDATE_SECRETS_ACCOUNT: >-
        {"CLOUDFLARE_ACCOUNT_ID": ${{ secrets['CLOUDFLARE_ACCOUNT_ID'] != '' }}, "CLOUDFLARE_ACCOUNT_ID ": ${{ secrets['CLOUDFLARE_ACCOUNT_ID '] != '' }}, " CLOUDFLARE_ACCOUNT_ID": ${{ secrets[' CLOUDFLARE_ACCOUNT_ID'] != '' }}, "cloudflare_account_id": ${{ secrets['cloudflare_account_id'] != '' }}, "CLOUDFLARE_ACCOUNT": ${{ secrets['CLOUDFLARE_ACCOUNT'] != '' }}, "ACCOUNT_ID": ${{ secrets['ACCOUNT_ID'] != '' }}, "CF_ACCOUNT_ID": ${{ secrets['CF_ACCOUNT_ID'] != '' }}, "CLOUDFLARE_ACCOUNTID": ${{ secrets['CLOUDFLARE_ACCOUNTID'] != '' }}, "CLOUDFLARE_ACCOUNT_ID_KEY": ${{ secrets['CLOUDFLARE_ACCOUNT_ID_KEY'] != '' }}, "GITHUB_TOKEN": ${{ secrets['GITHUB_TOKEN'] != '' }}, "ACTIONS_RUNTIME_TOKEN": ${{ secrets['ACTIONS_RUNTIME_TOKEN'] != '' }}, "ACTIONS_ID_TOKEN_REQUEST_TOKEN": ${{ secrets['ACTIONS_ID_TOKEN_REQUEST_TOKEN'] != '' }}}
      CANDIDATE_VARS_TOKEN: >-
        {"CLOUDFLARE_API_TOKEN": ${{ vars['CLOUDFLARE_API_TOKEN'] != '' }}, "CLOUDFLARE_API_TOKEN ": ${{ vars['CLOUDFLARE_API_TOKEN '] != '' }}, " CLOUDFLARE_API_TOKEN": ${{ vars[' CLOUDFLARE_API_TOKEN'] != '' }}, "cloudflare_api_token": ${{ vars['cloudflare_api_token'] != '' }}, "Cloudflare_Api_Token": ${{ vars['Cloudflare_Api_Token'] != '' }}, "CLOUDFLARE_API_TOKEN_KEY": ${{ vars['CLOUDFLARE_API_TOKEN_KEY'] != '' }}, "CLOUDFLARE_TOKEN": ${{ vars['CLOUDFLARE_TOKEN'] != '' }}, "CF_API_TOKEN": ${{ vars['CF_API_TOKEN'] != '' }}, "CF_TOKEN": ${{ vars['CF_TOKEN'] != '' }}, "API_TOKEN": ${{ vars['API_TOKEN'] != '' }}, "WORKERS_TOKEN": ${{ vars['WORKERS_TOKEN'] != '' }}, "CLOUDFLARE_WORKERS_TOKEN": ${{ vars['CLOUDFLARE_WORKERS_TOKEN'] != '' }}}
      CANDIDATE_VARS_ACCOUNT: >-
        {"CLOUDFLARE_ACCOUNT_ID": ${{ vars['CLOUDFLARE_ACCOUNT_ID'] != '' }}, "CLOUDFLARE_ACCOUNT_ID ": ${{ vars['CLOUDFLARE_ACCOUNT_ID '] != '' }}, " CLOUDFLARE_ACCOUNT_ID": ${{ vars[' CLOUDFLARE_ACCOUNT_ID'] != '' }}, "cloudflare_account_id": ${{ vars['cloudflare_account_id'] != '' }}, "CLOUDFLARE_ACCOUNT": ${{ vars['CLOUDFLARE_ACCOUNT'] != '' }}, "ACCOUNT_ID": ${{ vars['ACCOUNT_ID'] != '' }}, "CF_ACCOUNT_ID": ${{ vars['CF_ACCOUNT_ID'] != '' }}, "CLOUDFLARE_ACCOUNTID": ${{ vars['CLOUDFLARE_ACCOUNTID'] != '' }}, "CLOUDFLARE_ACCOUNT_ID_KEY": ${{ vars['CLOUDFLARE_ACCOUNT_ID_KEY'] != '' }}}
      CONTROLS: >-
        {"GITHUB_TOKEN": ${{ secrets['GITHUB_TOKEN'] != '' }}, "ACTIONS_RUNTIME_TOKEN": ${{ secrets['ACTIONS_RUNTIME_TOKEN'] != '' }}, "ACTIONS_ID_TOKEN_REQUEST_TOKEN": ${{ secrets['ACTIONS_ID_TOKEN_REQUEST_TOKEN'] != '' }}}
      WRANGLER_SEND_METRICS: 'false'
      WORKER: catpanel-test
      KV_TITLE: catpanel-test-kv
      EXPECT_VERSION: '6.67.0'
      OUT: /tmp/cf-live
      TOOLS: .github/workflows/cf-live-tools.mjs
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install wrangler (pinned)
        run: |
          npm install --no-save --no-audit --no-fund wrangler@4.149.0 --silent
          mkdir -p "$OUT"
          ./node_modules/.bin/wrangler --version

      - name: Preflight — token, account, subdomain, what else is on the account
        run: |
          set -o pipefail
          node "$TOOLS" preflight | tee "$OUT/00-preflight.log"

      - name: Create the throwaway KV namespace
        run: |
          set -o pipefail
          node "$TOOLS" kv-create | tee "$OUT/01-kv.log"

      - name: Build the test config from wrangler.jsonc (min, explicit KV id, no cron)
        run: |
          set -o pipefail
          node "$TOOLS" config --main=dist-panel/catpanel.min.js --kv-id="$KV_ID" | tee "$OUT/02-config.log"

      - name: Generate the app-style UUID + panel password (masked)
        run: |
          set -o pipefail
          node "$TOOLS" gen-credentials | tee "$OUT/03-credentials.log"
          # The derived UUID is SHA-256 of the FULL hostname — the first live run
          # computed it from "catpanel-test.zojfup" and every /sub/ check 404'd.
          DERIVED=$(node "$TOOLS" uuid --host="${BASE#https://}")
          echo "::add-mask::$DERIVED"
          echo "SUB_KEY_DERIVED=$DERIVED" >> "$GITHUB_ENV"
          echo "derived UUID for a passwordless panel on $WORKER.$SUBDOMAIN.workers.dev: computed and masked"

      # ── stage A ────────────────────────────────────────────────────────────
      - name: Stage A — deploy dist-panel/catpanel.min.js (wrangler, --no-bundle)
        continue-on-error: true
        run: |
          set -o pipefail
          node "$TOOLS" deploy --main=dist-panel/catpanel.min.js 2>&1 | tee "$OUT/deploy-A.log"
          node "$TOOLS" stage --label=A-min --mode=open --sub-key="$SUB_KEY_DERIVED" 2>&1 | tee "$OUT/stage-A.log"

      # ── stage A2 ───────────────────────────────────────────────────────────
      - name: Stage A2 — same file, wrangler's own bundler (no --no-bundle)
        continue-on-error: true
        run: |
          set -o pipefail
          node "$TOOLS" deploy --main=dist-panel/catpanel.min.js --bundle 2>&1 | tee "$OUT/deploy-A2.log"
          node "$TOOLS" stage --label=A2-bundled --mode=locked --sub-key="$SUB_KEY_DERIVED" 2>&1 | tee "$OUT/stage-A2.log"

      # ── stage B ────────────────────────────────────────────────────────────
      - name: Stage B — deploy dist-panel/catpanel.obf.js (the app's API artifact)
        continue-on-error: true
        run: |
          set -o pipefail
          node "$TOOLS" deploy --main=dist-panel/catpanel.obf.js 2>&1 | tee "$OUT/deploy-B.log"
          node "$TOOLS" stage --label=B-obf --mode=locked --sub-key="$SUB_KEY_DERIVED" 2>&1 | tee "$OUT/stage-B.log"

      # ── stage C ────────────────────────────────────────────────────────────
      - name: Stage C — the app's own upload path (multipart PUT + app bindings)
        continue-on-error: true
        run: |
          set -o pipefail
          node "$TOOLS" upload-app 2>&1 | tee "$OUT/upload-C.log"
          node "$TOOLS" stage --label=C-app-api --mode=locked --sub-key="$APP_UUID" 2>&1 | tee "$OUT/stage-C.log"

      # ── cleanup (always, so nothing is left behind even on a failure) ──────
      - name: Cleanup — delete catpanel-test and the test KV
        if: always()
        run: |
          set -o pipefail
          node "$TOOLS" cleanup 2>&1 | tee "$OUT/09-cleanup.log"

      - name: Summary (fails the job only if a hard expectation broke)
        if: always()
        run: |
          set -o pipefail
          node "$TOOLS" summary 2>&1 | tee "$OUT/10-summary.log"

      # The raw job log sits behind a signed blob URL that the owner's tooling
      # cannot fetch, and annotations cap at ten per step — so the whole result
      # (every check, every raw response, the tail log, the cleanup verification)
      # is committed onto the branch as cf-live-results.md. [skip ci] keeps this
      # commit from starting another round of workflows.
      - name: Publish cf-live-results.md onto the branch
        if: always() && github.event_name == 'push'
        run: |
          set -e
          if [ ! -f cf-live-results.md ]; then echo "no results file (nothing ran)"; exit 0; fi
          cp cf-live-results.md /tmp/cf-live-results.md
          git config user.name "cf-live-test"
          git config user.email "cf-live-test@users.noreply.github.com"
          git fetch origin "$GITHUB_REF_NAME"
          git checkout -B cf-live-publish FETCH_HEAD
          cp /tmp/cf-live-results.md cf-live-results.md
          git add cf-live-results.md
          git commit -m "cf live test results [skip ci]" || true
          git push origin HEAD:"$GITHUB_REF_NAME" || true
          echo "published cf-live-results.md"
