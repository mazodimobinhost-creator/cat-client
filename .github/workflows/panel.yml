name: Panel tests

on:
  push:
    branches: [main, 'arena/*']
    paths:
      - 'app/src/main/assets/panels/**'
      - 'scripts/panels/**'
      - 'package.json'
      - '.github/workflows/panel.yml'
  pull_request:
    paths:
      - 'app/src/main/assets/panels/**'
      - 'scripts/panels/**'
      - 'package.json'
      - '.github/workflows/panel.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: panel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Syntax check (Worker must stay a single valid script)
        run: |
          node --check app/src/main/assets/panels/catclient.worker.js
          node --check app/src/main/assets/panels/catclient.wizard.js
      - name: Unit tests
        run: npm test
      - name: Report panel test failures back to the branch
        if: failure() && !contains(github.event.head_commit.message, 'CI test failure report')
        run: |
          # Every suite file, not just the four old ones — a failure in ANY of them must be visible.
          for t in cat-panel ccq ech panel-dom wizard multipart-upload chain-protocols android-guard link-shape panel-integrity kv-persistence panel-update-contract panel-selfupdate sni-host proxyip-sub proxyip-dataplane addr-port-query; do
            if node scripts/panels/$t.test.mjs > "/tmp/$t.out" 2>&1; then
              echo "PASS $t" >> FAILED-TESTS.md
            else
              { echo "FAIL $t"; echo '```'; tail -n 60 "/tmp/$t.out"; echo '```'; } >> FAILED-TESTS.md
            fi
          done
          git config user.name "ci-report-bot"
          git config user.email "ci@users.noreply.github.com"
          # On pull_request events github.ref_name is «N/merge» (unpushable) and the checkout is a
          # detached MERGE commit — build the report commit on the real head ref instead, rebase
          # over anything that landed meanwhile (snapshot commits), then push.
          TARGET_REF="${{ github.event.pull_request.head.ref || github.ref_name }}"
          git fetch origin "$TARGET_REF" || true
          git checkout -B ci-report FETCH_HEAD || true
          git pull --rebase origin "$TARGET_REF" || true
          git add FAILED-TESTS.md
          git commit -m "CI panel test failure report [skip ci]" || true
          git push origin HEAD:"$TARGET_REF" || true
