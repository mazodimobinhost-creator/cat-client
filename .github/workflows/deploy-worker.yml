name: Deploy panel worker

# Deploys the Cat Panel worker to Cloudflare with `wrangler deploy`.
# Triggers:
#   - Telegram /deploy  → panel worker → repository_dispatch (cat-deploy)
#   - push to the worker file / wrangler config
#   - manual workflow_dispatch
# Required repository Secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   — Cloudflare token with "Workers Scripts:Edit"
#   CLOUDFLARE_ACCOUNT_ID  — your Cloudflare account id
# Optional (Telegram result messages):
#   TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID
# Without secrets the workflow still passes — deploy is skipped with a notice.
#
# ⚠️ PUSHES TO arena/* NO LONGER DEPLOY. Now that the Cloudflare secrets exist in
# this repository, a push to a working branch used to run `wrangler deploy` and
# overwrite the live Worker named in wrangler.jsonc (empty-wave-5d02) with
# whatever that branch happened to contain — a one-line edit on a side branch
# replaced a live panel. Publishing is therefore limited to the default branch;
# `workflow_dispatch` (pick the branch deliberately) and the Telegram
# repository_dispatch still deploy on request.

on:
  workflow_dispatch:
  repository_dispatch:
    types: [cat-deploy]
  push:
    branches: [main, 'arena/*']
    paths:
      - 'app/src/main/assets/panels/catclient.worker.js'
      - 'wrangler.jsonc'
      - '.github/workflows/deploy-worker.yml'

permissions:
  contents: read

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    # Only the default branch publishes on a push — see the note above. Manual
    # runs and the Telegram /deploy path are unaffected.
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Read panel version
        run: echo "PVER=$(grep -o "CAT_PANEL_VERSION = '[^']*" app/src/main/assets/panels/catclient.worker.js | cut -d"'" -f2)" >> "$GITHUB_ENV"

      - name: Syntax check
        run: node --check app/src/main/assets/panels/catclient.worker.js

      # Build the exact normal minified entrypoint named by wrangler.jsonc.
      - name: Build configured worker artifact
        run: |
          npm install --no-save terser acorn --silent
          node scripts/panels/minify.mjs app/src/main/assets/panels/catclient.worker.js dist-panel/catpanel.min.js --check

      - name: Pre-deploy Worker regression suite
        run: npm test

      - name: Deploy to Cloudflare
        id: deploy
        if: env.CF_TOKEN != '' && env.CF_ACCOUNT != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT }}
        run: |
          set -o pipefail
          # --no-bundle uploads the committed artifact byte for byte. Bundling runs it
          # through esbuild, which escapes every non-ASCII character (Persian text and
          # emoji): 602 KiB / 139.40 KiB gzipped instead of 458 KiB / 127.39 KiB, and it
          # also re-warns about duplicate keys that are already in the artifact.
          npx --yes wrangler@latest deploy --no-bundle 2>&1 | tee deploy.log

      - name: Notice (secrets not configured)
        if: env.CF_TOKEN == '' || env.CF_ACCOUNT == ''
        run: |
          echo "::warning::Deploy SKIPPED — set CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID repository secrets. This green run deployed NOTHING."
          echo '### ⚠️ NOT deployed — no Cloudflare secrets configured' >> "$GITHUB_STEP_SUMMARY"

      - name: Verify deployed health + exact version
        id: verify
        if: steps.deploy.outcome == 'success'
        run: |
          set -euo pipefail
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1 || true)
          if [ -z "$URL" ]; then
            echo "::error::deploy succeeded but its workers.dev URL could not be parsed; refusing an unverified release"
            exit 1
          fi
          sleep 6
          # Three fresh, exact-version answers are required. A single cached 200
          # cannot mark a newly uploaded Worker healthy.
          for attempt in 1 2 3; do
            nonce="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}-$(date +%s%N)"
            headers="$(mktemp)"
            HEALTH=$(curl -fsS --max-time 20 --retry 1 --retry-all-errors \
              -H 'cache-control: no-store' -D "$headers" "$URL/health?cat_verify=$nonce")
            echo "health[$attempt]: $HEALTH"
            echo "$HEALTH" | grep -q '"ok":true' || { echo "::error::fresh /health does not answer ok:true"; exit 1; }
            VERSION_JSON=$(curl -fsS --max-time 20 --retry 1 --retry-all-errors \
              -H 'cache-control: no-store' "$URL/api/version?cat_verify=$nonce")
            node -e 'let j; try { j=JSON.parse(process.argv[1]); } catch { console.error("/api/version returned invalid JSON"); process.exit(1); } const want=process.argv[2]; if(j.ok!==true || j.version!==want){ console.error("deployed panel version mismatch: expected "+want+", got "+(j.version||"unknown")); process.exit(1); }' "$VERSION_JSON" "$PVER"
            # A Cloudflare error document or cached intermediary answer must not
            # silently count as our Worker response.
            grep -qi '^content-type: application/json' "$headers" || { echo "::error::health content-type is not JSON"; cat "$headers"; exit 1; }
            rm -f "$headers"
            sleep 2
          done
          echo "✅ 3 fresh health + exact-version probes OK: $URL is running panel $PVER"

      - name: Roll back a deployment that failed verification
        if: failure() && steps.deploy.outcome == 'success' && steps.verify.outcome == 'failure'
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT }}
        run: |
          echo "::warning::New Worker failed post-deploy verification; rolling back to Cloudflare's previous deployment"
          npx --yes wrangler@latest rollback --message "Cat automatic rollback: health/version verification failed in ${GITHUB_RUN_ID}" --yes
          echo '### ↩️ Automatic rollback requested after failed health verification' >> "$GITHUB_STEP_SUMMARY"

      - name: Notify Telegram
        if: always() && env.TG_TOKEN != '' && env.TG_CHAT != ''
        run: |
          if [ "${{ steps.deploy.outcome }}" = "success" ]; then
            ICON="✅"; MSG="deployed to Cloudflare"
          else
            ICON="❌"; MSG="deploy FAILED"
          fi
          curl -s -o /dev/null --max-time 15 -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT}" \
            -d text="🐱 Cat Panel ${PVER:-?} ${ICON} ${MSG} — ${GITHUB_REPOSITORY}@${GITHUB_REF_NAME}
          $( [ -f deploy.log ] && tail -n 3 deploy.log | tr '\n' ' ' )
          ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" || true
