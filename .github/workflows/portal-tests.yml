name: Cat account portal tests
on:
  push:
    branches: [arena/c5b36768-cat-client]
    paths: ['portal/**', 'scripts/pages/portal-target.test.mjs', 'package.json', '.github/workflows/portal-tests.yml']
  pull_request:
    paths: ['portal/**', 'scripts/pages/portal-target.test.mjs', 'package.json', '.github/workflows/portal-tests.yml']
permissions:
  contents: read
concurrency:
  group: portal-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - run: node --check portal/src/_worker.js
      - run: node --test scripts/pages/portal-target.test.mjs
      - name: Verify live edge deployment (worker-1101-doctor)
        continue-on-error: true
        run: |
          node --input-type=module -e "
          import { verifyLivePanelDeployment } from './scripts/panels/worker-1101-doctor.mjs';
          const base = 'https://edge-aybca.catclient-ldqlurrj.workers.dev';
          const out = {};
          try {
            out.doctor = await verifyLivePanelDeployment(base, '6.69.17', { attempts: 3, delayMs: 400 });
          } catch (e) { out.doctorError = String(e.message || e); }
          for (const p of ['/health', '/api/version', '/?av=1.10.0-beta132&pv=6.69.17', '/panel/?av=1.10.0-beta132&pv=6.69.17', '/api/selfcheck?throw=1']) {
            try {
              const r = await fetch(base + p, { redirect: 'manual' });
              const txt = (await r.text()).slice(0, 260).replace(/\s+/g, ' ');
              out[p] = { status: r.status, location: r.headers.get('location'), cfRay: r.headers.get('cf-ray'), head: txt };
            } catch (e) { out[p] = { error: String(e.message || e) }; }
          }
          try {
            const lr = await fetch(base + '/api/login', {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify({ username: 'admin', password: 'admin' })
            });
            const lbody = await lr.text();
            const cookie = (lr.headers.get('set-cookie') || '').split(';')[0];
            out.login = { status: lr.status, hasCookie: cookie.startsWith('cat_session='), body: lbody.slice(0, 160) };
            if (cookie) {
              const ur = await fetch(base + '/api/update-check', { headers: { cookie } });
              out.updateCheck = { status: ur.status, body: (await ur.text()).slice(0, 260) };
            }
          } catch (e) { out.login = { error: String(e.message || e) }; }
          const msg = JSON.stringify(out).replace(/%/g, '%25').replace(/\r/g, '%0D').replace(/\n/g, '%0A');
          console.log('::notice title=live-edge-probe::' + msg);
          "
      - name: Reject committed credentials
        run: |
          ! grep -RIE '([0-9]{8,10}:[A-Za-z0-9_-]{30,}|CF_API_TOKEN\s*[=:]\s*[^$])' portal
