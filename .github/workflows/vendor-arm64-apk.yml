# GitHub runners can reach release-assets.githubusercontent.com; this sandbox
# cannot. Split signed APKs into git-safe <50MB parts so they can be pulled
# over github.com and hosted on Drive (zip) for Iran.
name: Vendor beta317 arm64 APK

on:
  push:
    branches: ['arena/*']
    paths:
      - '.github/workflows/vendor-arm64-apk.yml'

permissions:
  contents: write

concurrency:
  group: vendor-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download and split APKs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p dist-apk
          gh release download v1.10.0-beta317 \
            --repo "${{ github.repository }}" \
            --pattern 'CatClient-V1.10.0-beta317-arm64-v8a.apk' \
            --pattern 'CatClient-V1.10.0-beta317-armeabi-v7a.apk' \
            --pattern 'SHA256SUMS' \
            --dir /tmp/rel
          ls -lh /tmp/rel
          (cd /tmp/rel && sha256sum -c SHA256SUMS --ignore-missing)
          for apk in CatClient-V1.10.0-beta317-arm64-v8a.apk CatClient-V1.10.0-beta317-armeabi-v7a.apk; do
            SIZE=$(stat -c%s "/tmp/rel/$apk")
            echo "${apk}_bytes=$SIZE"
            test "$SIZE" -gt 70000000
            python3 -c "import sys; d=open(sys.argv[1],'rb').read(4); assert d==b'PK\x03\x04', d" "/tmp/rel/$apk"
            split -b 40m -d -a 2 "/tmp/rel/$apk" "dist-apk/${apk}.bin."
          done
          cp /tmp/rel/SHA256SUMS dist-apk/SHA256SUMS
          sha256sum /tmp/rel/*.apk dist-apk/*.bin.* | tee dist-apk/SHA256-parts.txt
          ls -lh dist-apk

      - name: Commit split APK
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist-apk
          git commit -m "vendor beta317 APK parts for Iran Drive zip [skip ci]"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
