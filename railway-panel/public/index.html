<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cat Railway Panel</title>
<style>:root{color-scheme:dark;--bg:#07110f;--card:#10201d;--line:#28463f;--text:#eefbf7;--muted:#a8c0ba;--cat:#31e0bb;--bad:#ff6d7a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 90% 0,#163f36,transparent 40%),var(--bg);color:var(--text);font-family:system-ui,sans-serif;min-height:100vh}main{width:min(940px,100%);margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:24px;margin:0}.badge{padding:7px 10px;border:1px solid var(--line);border-radius:999px;color:var(--cat)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-top:16px}.card{background:#10201ddd;border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 14px 36px #0005}.wide{grid-column:1/-1}label{display:block;color:var(--muted);font-size:13px;margin:10px 0 5px}input,select,button{width:100%;min-height:44px;border-radius:11px;border:1px solid var(--line);background:#091713;color:var(--text);padding:10px}button{background:var(--cat);color:#032019;font-weight:800;cursor:pointer;margin-top:10px}button.secondary{background:transparent;color:var(--cat)}button.danger{background:var(--bad);color:#250308}.row{display:flex;gap:8px}.row>*{flex:1}.hidden{display:none}.muted{color:var(--muted);font-size:13px}.item{padding:10px 0;border-bottom:1px solid var(--line)}pre{white-space:pre-wrap;word-break:break-word;color:var(--muted);max-height:220px;overflow:auto}#toast{position:fixed;left:16px;bottom:16px;padding:12px 16px;background:#142d27;border:1px solid var(--cat);border-radius:12px;display:none}@media(max-width:560px){main{padding:12px}.row{display:block}.row>*{margin-top:7px}}</style></head>
<body><main><header class="top"><div><h1>🐱 Cat Railway Panel</h1><div class="muted">پنل مستقل Railway</div></div><span class="badge" id="status">در حال بررسی…</span></header>
<section id="login" class="card" style="max-width:420px;margin:40px auto"><h2>ورود مدیر</h2><label>نام کاربری</label><input id="username" value="admin" autocomplete="username"><label>رمز عبور</label><input id="password" type="password" autocomplete="current-password"><button onclick="login()">ورود امن</button></section>
<section id="app" class="hidden"><div class="grid"><article class="card"><h3>Runtime</h3><pre id="runtime">—</pre><button class="secondary" onclick="refresh()">بروزرسانی</button></article><article class="card"><h3>Xray</h3><pre id="xray">—</pre><div class="row"><button onclick="xray('start')">Start</button><button class="secondary" onclick="xray('restart')">Restart</button><button class="danger" onclick="xray('stop')">Stop</button></div></article>
<article class="card wide"><h3>ساخت کاربر</h3><div class="row"><div><label>نام</label><input id="new-user" placeholder="user_name"></div><div><label>رمز حداقل ۱۲ کاراکتر</label><input id="new-pass" type="password"></div><div><label>حجم (بایت، صفر نامحدود)</label><input id="quota" type="number" value="0"></div></div><button onclick="createUser()">ساخت کاربر و Subscription</button><pre id="created"></pre></article>
<article class="card wide"><h3>کاربران</h3><div id="users" class="muted">—</div></article>
<article class="card wide"><h3>Proxy IP / SNI</h3><div class="row"><input id="address" placeholder="IPv4 یا IPv6"><input id="sni" placeholder="panel.example.com"><input id="country" placeholder="DE" maxlength="2"><input id="port" type="number" value="443"></div><button onclick="addCandidate()">ثبت Candidate</button><div id="candidates" class="muted"></div></article>
<article class="card wide"><h3>Auto Inbound</h3><div class="row"><select id="inbound-user"></select><input id="inbound-country" placeholder="کشور، مثال DE" maxlength="2><select id="ip-version"><option value="">IPv4/IPv6 خودکار</option><option value="4">IPv4</option><option value="6">IPv6</option></select></div><button onclick="autoInbound()">اسکن شواهد و ساخت خودکار</button><pre id="inbound-result"></pre></article></div></section></main><div id="toast"></div>
<script>let token=sessionStorage.getItem('cat-token')||'';const $=id=>document.getElementById(id);function toast(x){$('toast').textContent=x;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2600)}async function api(path,opt={}){const r=await fetch(path,{...opt,headers:{'content-type':'application/json',...(token?{authorization:'Bearer '+token}:{}),...(opt.headers||{})}});const j=await r.json().catch(()=>({error:'invalid_response'}));if(!r.ok)throw Error(j.error||'request_failed');return j}async function boot(){try{const h=await api('/health');$('status').textContent='Online · '+h.version}catch{$('status').textContent='Offline'}if(token){try{await api('/api/me');show();await refresh()}catch{token='';sessionStorage.removeItem('cat-token')}}}async function login(){try{const j=await api('/api/login',{method:'POST',body:JSON.stringify({username:$('username').value,password:$('password').value})});token=j.token;sessionStorage.setItem('cat-token',token);show();refresh()}catch(e){toast(e.message)}}function show(){$('login').classList.add('hidden');$('app').classList.remove('hidden')}async function refresh(){try{const [r,x,u,c]=await Promise.all([api('/runtime'),api('/api/xray/status'),api('/api/users'),api('/api/candidates')]);$('runtime').textContent=JSON.stringify(r,null,2);$('xray').textContent=JSON.stringify(x,null,2);$('users').innerHTML=u.users.map(v=>`<div class=item><b>${esc(v.username)}</b> · ${esc(v.role)} · لینک‌ها ${v.linkCount||0}</div>`).join('');$('inbound-user').innerHTML=u.users.filter(v=>v.role==='user').map(v=>`<option value="${v.id}">${esc(v.username)}</option>`).join('');$('candidates').innerHTML=c.candidates.map(v=>`<div class=item>${esc(v.country||'--')} · ${esc(v.address)} · ${esc(v.sni)} · ${v.evidence?.ok?'✅ '+v.evidence.latencyMs+'ms':'آزمایش‌نشده'}</div>`).join('')}catch(e){toast(e.message)}}async function xray(action){try{await api('/api/xray/'+action,{method:'POST'});refresh()}catch(e){toast(e.message)}}async function createUser(){try{const j=await api('/api/users',{method:'POST',body:JSON.stringify({username:$('new-user').value,password:$('new-pass').value,quotaBytes:Number($('quota').value)||0})});$('created').textContent='توکن فقط همین یک بار نمایش داده می‌شود:\n'+j.user.subscriptionToken;refresh()}catch(e){toast(e.message)}}async function addCandidate(){try{await api('/api/candidates',{method:'POST',body:JSON.stringify({address:$('address').value,sni:$('sni').value,country:$('country').value,port:Number($('port').value)})});refresh()}catch(e){toast(e.message)}}async function autoInbound(){try{const j=await api('/api/auto-inbound',{method:'POST',body:JSON.stringify({userId:$('inbound-user').value,country:$('inbound-country').value,ipVersion:Number($('ip-version').value)||undefined})});$('inbound-result').textContent=j.link;refresh()}catch(e){toast(e.message)}}function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}boot();</script></body></html>
