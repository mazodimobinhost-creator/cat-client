<style>

*{box-sizing:border-box}

main{max-width:460px;margin:0 auto;padding:14px 14px 96px}
.chips{display:none;gap:8px;overflow-x:auto;padding-bottom:10px}
.chip,.tab,.cb{font:inherit;color:var(--tx);background:transparent;border:1px solid var(--ln);cursor:pointer}
.chip{flex:none;padding:7px 12px;font-size:12px}
.chip[aria-pressed=true]{border-color:var(--ac2);color:#fff;background:#0f2766}
.panel{border:1px solid var(--ln);background:var(--pn);position:relative}
.tabs{display:inline-flex;margin:10px;border:1px solid var(--ln);padding:3px;background:#0a1230}
.tab{border:0;padding:9px 14px;font-size:12px;font-weight:600;letter-spacing:.08em}

.nm{font-size:10px;font-weight:800;fill:var(--tx)}

.ic{cursor:pointer}
.ic.lit polygon,.ic.lit path{stroke:#9cc0ff}
.ic.bad polygon,.ic.bad path,.ic.bad line{stroke:var(--er)}
.lk{stroke:#2a4797;stroke-width:1.2;stroke-dasharray:3 4;fill:none}
.lk.on{stroke:var(--ac2);stroke-width:1.8;animation:fl .8s linear infinite}
@keyframes fl{to{stroke-dashoffset:-14}}
@media (prefers-reduced-motion:reduce){.lk.on{animation:none}}
#ni{padding:8px 12px 12px;font-size:11px;color:var(--mu);min-height:34px;font-family:sans-serif}
.ov{border:1px solid var(--ln);margin-top:12px;background:var(--pn)}
.ov h3{margin:0;padding:12px 14px;font-size:15px;letter-spacing:.14em;font-weight:800;border-bottom:1px solid var(--ln)}
.bd{padding:14px}
.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.hd h2{margin:0;font-size:24px;font-weight:800;letter-spacing:.04em}
.bg{font-size:11px;font-weight:600;letter-spacing:.12em;padding:7px 10px;border:1px solid;white-space:nowrap}
.bg i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;background:currentColor}
.bg.rd{color:var(--mu)}.bg.go{color:var(--am);background:#2a2008}.bg.ok{color:var(--go);background:#0e2a1d}.bg.er{color:var(--er);background:#2a1016}
.sb{color:var(--tx);font-size:13px;margin:6px 0 10px}
.fa{font-family:sans-serif;direction:rtl;text-align:right;font-size:13.5px;line-height:1.9;color:#aebde8;margin:0}
.stp{margin-top:12px;padding-top:12px;border-top:1px solid var(--ln);font-size:12px;font-weight:600;color:var(--ac2)}
.bar{position:fixed;left:0;right:0;bottom:0;background:#0a0f20;border-top:1px solid var(--ln);padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px))}
.bi{max-width:460px;margin:0 auto;display:grid;grid-template-columns:48px 44px 1fr 66px 44px;gap:8px}
.cb{height:46px;font-size:13px;font-weight:600;letter-spacing:.08em}
.cb.pl{background:var(--ac);border-color:var(--ac2);color:#fff}
</style>
</head>

let cur=0,idx=-1,u=0,run=null,fail=false,spd=1,view="net",els={},pk,hold=false;
function build(){
 net.innerHTML="";els={};const c=CF[cur];
 const df=S("defs",{},net);const pt=S("pattern",{id:"gr",width:24,height:24,patternUnits:"userSpaceOnUse"},df);
 S("path",{d:"M24 0H0V24",fill:"none",stroke:"#14224f","stroke-width":.6},pt);
 S("rect",{x:0,y:0,width:340,height:400,fill:"url(#gr)"},net);
 c.links.forEach(l=>{const a=c.nodes[l[0]],b=c.nodes[l[1]];els[l]=S("line",{x1:a.x,y1:a.y-8,x2:b.x,y2:b.y-8,class:"lk"},net)});
 for(const k in c.nodes){const n=c.nodes[k],g=S("g",{transform:`translate(${n.x} ${n.y})`,tabindex:0,role:"button","aria-label":n.n,class:"ic"},net);

function pos(path,t){const c=CF[cur],p=path.map(k=>c.nodes[k]),L=[];let tot=0;

 if(!pk)return;

 c.links.forEach(l=>els[l].classList.remove("on"));
 for(const k in c.nodes)els[k].classList.remove("lit","bad");

 add("tcpr",[t,"r"],"SYN-ACK",tn+" اتصال را می‌پذیرد.",1);
 if(sec==="tls"||sec==="reality"){const rl=sec==="reality";
  add("tls",["r",t],rl?"Reality ClientHello":"TLS ClientHello","شروع رمزنگاری. SNI برابر "+sni+" است.");
  add("tlsr",[t,"r"],"ServerHello","گواهی و کلید توافق می‌شود. از اینجا همه‌چیز رمز است.",1)}
 if(tr==="ws"||tr==="httpupgrade"){
  add("ws",cdn?["r","f","s"]:["r","s"],"WebSocket Upgrade","درخواست Upgrade"+(g.path?" روی مسیر "+g.path:"")+" به سرور می‌رسد.");
  add("wsr",cdn?["s","f","r"]:["s","r"],"101 Switching Protocols","سرور قبول می‌کند و اتصال WebSocket باز می‌شود.",1)}
 else if(tr==="grpc"||tr==="h2")add("ws",cdn?["r","f","s"]:["r","s"],"HTTP/2 stream","یک stream "+(TRN[tr])+" به سرور باز می‌شود.");
 S.push({k:"data",p:cdn?["c","r","f","s"]:["c","r","s"],t:"Encrypted data",f:1,d:"کانال برقرار است. داده رمزشده رفت و برگشت می‌شود."});
 let err;
 if(g.fail){const i=S.findIndex(s=>s.k===g.fail.at);if(i>=0){S.length=i+1;S[i].x=1;S[i].f=0;err=g.fail.msg||"اتصال در این مرحله ناموفق بود."}}
 return{k:g.name||"Config",title:px+" "+(TRN[tr]||tr),sub:(g.name||"")+(sec!=="none"?" · "+sec.toUpperCase():""),
  desc:cdn?"ترافیک از Cat Client رد می‌شود، رمز می‌شود و از پشت CDN به سرور می‌رسد.":"ترافیک از Cat Client رد می‌شود، رمز می‌شود و مستقیم به سرور می‌رسد.",err,nodes:N,links:L,steps:S}}
function loadCfg(g){CF.splice(0,CF.length,mk(typeof g==="string"?JSON.parse(g):g));cur=0;ch.style.display="none";
 $("ni").textContent="Tap a device for details.";build();hold=false;reset()}
function setState(s,m){const c=CF[cur];
 if(s==="connecting"){hold=true;reset();$("pp").click()}
 else if(s==="connected"){hold=false;fail=false;idx=c.steps.length-1;u=0;run="play";ui()}
 else if(s==="failed"){let i=c.steps.findIndex(x=>x.x);if(i<0){i=Math.max(0,Math.min(idx,c.steps.length-1));c.steps[i].x=1;c.steps[i].f=0}
  if(m)c.err=m;else if(!c.err)c.err="اتصال ناموفق بود.";hold=false;idx=i;u=1;fail=true;run=null;ui()}}
window.CatPath={load:loadCfg,setState:setState,mk:mk};
$("pp").onclick=()=>{const c=CF[cur];if(run==="play"){run=null}else{if(fail)reset();if(idx<0){idx=0;u=0}else if(u>=1&&idx<c.steps.length-1){idx++;u=0}run="play"}ui()};
$("st").onclick=()=>{const c=CF[cur],s=c.steps[idx];if(fail)return;
 if(idx<0){idx=0;u=0;run="once"}else if(u<1&&!s.f){u=1;run=null}else if(idx<c.steps.length-1){idx++;u=0;run="once"}ui()};
$("pv").onclick=()=>{fail=false;run=null;if(idx>0){idx--;u=1}else{idx=-1;u=0}ui()};
$("rs").onclick=reset;
$("sp").onclick=()=>{spd=spd===1?2:spd===2?.5:1;$("sp").textContent=spd+"×"};
function tab(v){view=v;net.hidden=v!=="net";sq.hidden=v!=="seq";$("tn").setAttribute("aria-selected",v==="net");$("ts").setAttribute("aria-selected",v==="seq")}
$("tn").onclick=()=>tab("net");$("ts").onclick=()=>tab("seq");
requestAnimationFrame(tick);
})();
</script>
